name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "${{ matrix.node-version }}"
          cache: npm
      - run: npm ci
      # Blender-dependent suites skip themselves when no Blender binary is present.
      - name: Tests
        run: node --test test/*.test.js test/independent/*.test.js test/final-qa/*.test.js
